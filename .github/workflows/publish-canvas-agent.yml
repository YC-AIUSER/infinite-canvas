name: Publish Canvas Agent

on:
  push:
    branches:
      - main
    paths:
      - "canvas-agent/**"
      - ".github/workflows/publish-canvas-agent.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-canvas-agent
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: canvas-agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check package version
        id: package
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npm view "$name@$version" version 2>/dev/null || true)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$published" ]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      # 粘贴 secret 时常混入换行/回车（Windows 尤其），会让 npm 构造 Authorization 头失败
      # 报 "is not a legal HTTP header value"。这里清洗后再用，并输出不泄露内容的诊断。
      - name: Check npm token shape
        if: steps.package.outputs.should_publish == 'true'
        id: token
        run: |
          raw="$NPM_TOKEN_RAW"
          clean=$(printf '%s' "$raw" | tr -d '[:space:]')
          if [ -z "$clean" ]; then
            echo "NPM_TOKEN 未配置或为空，无法发布" >&2
            exit 1
          fi
          if [ "${#raw}" -ne "${#clean}" ]; then
            echo "注意：token 含空白字符（长度 ${#raw} → ${#clean}），已自动清洗后使用。"
          fi
          case "$clean" in
            npm_*) echo "token 前缀检查：通过（npm_ 开头）" ;;
            *) echo "警告：token 不以 npm_ 开头，可能粘贴了整行 .npmrc 或类型不对；仍继续尝试。" ;;
          esac
          echo "::add-mask::$clean"
          echo "value=$clean" >> "$GITHUB_OUTPUT"
        env:
          NPM_TOKEN_RAW: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.package.outputs.should_publish == 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ steps.token.outputs.value }}

      - name: Skip existing version
        if: steps.package.outputs.should_publish != 'true'
        run: echo "${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} already exists on npm, skipping publish."
